  <!-- SCRIPT FOR THE AI GENERATOR -->
  <script>
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 

    window.generatePromo = async function() {
      const idea = document.getElementById('promoIdea').value;
      if (!idea) return alert("Please describe your app idea first.");
      
      const btn = document.getElementById('genBtn');
      const output = document.getElementById('promoOutput');
      
      btn.innerText = "...";
      btn.disabled = true;
      output.value = "Thinking...";

      if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
        setTimeout(() => {
          output.value = `Build a responsive web app for "${idea}". Use Tailwind CSS, HTML, JS, and Firebase. Include a dark mode UI, a landing page, and a cart system.`;
          btn.innerText = "Generate";
          btn.disabled = false;
        }, 1000);
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Write a highly detailed AI coding prompt for this app idea: "${idea}". Tell the AI to use HTML, Tailwind CSS, and Firebase.` }] }]
          })
        });
        const data = await response.json();
        output.value = data.candidates[0].content.parts[0].text;
      } catch (error) {
        output.value = "Error connecting to AI. Check API key.";
      } finally {
        btn.innerText = "Generate";
        btn.disabled = false;
      }
    }
  </script>
